{{- /* Giscus comments, stored as GitHub Discussions in the blog repo.
       Configured in hugo.toml under [params.giscus]; a post can opt out with `comments: false`. */ -}}
{{- with site.Params.giscus -}}
{{- if and .categoryId (ne $.Params.comments false) -}}
<section class="post-comments" aria-label="Comments">
  <script src="https://giscus.app/client.js"
    data-repo="{{ .repo }}"
    data-repo-id="{{ .repoId }}"
    data-category="{{ .category }}"
    data-category-id="{{ .categoryId }}"
    data-mapping="pathname"
    data-strict="1"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="preferred_color_scheme"
    data-lang="en"
    data-loading="lazy"
    crossorigin="anonymous"
    async></script>
</section>
{{- end -}}
{{- end -}}
